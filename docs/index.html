<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Frame Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a 1280x800 landscape wall panel. Main view on the left, a touch tab rail on the right edge.
   One committed dark look (a lamp-lit room at night), dimmed further overnight.
   Colors use 6-digit hex and rgb() only: the frame's WebView 106 rejects 8-digit hex. */
:root {
  --bg: #11161b;
  --panel: #192028;
  --panel-2: #212a34;
  --line: #2a333d;
  --fg: #ede8e0;
  --muted: #8f9aa6;
  --lamp: #f0b35e;
  --lamp-ink: #241a0c;
  --rain: #72b4da;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
html { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 18px;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* The panel is laid out at 1280x800 and zoomed to fill whatever screen it's on (fitPanel below). */
body { display: flex; align-items: center; justify-content: center; }
.app {
  box-sizing: border-box;
  width: 1280px;
  height: 800px;
  flex: none;
  display: grid;
  grid-template-columns: 1fr 104px;
  grid-template-rows: minmax(0, 1fr); /* keeps tall tabs (Music) inside 800px so their lists scroll */
}
.view { box-sizing: border-box; height: 100%; min-width: 0; min-height: 0; padding: 36px 40px 28px 44px; }
.view.frame { padding: 0; }
.view.frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.view-title { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.view-title h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 40px; letter-spacing: -1px; flex: 1; min-width: 0; }
.eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

/* Art slideshow when idle */
.art { position: fixed; inset: 0; background: #000; cursor: pointer; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 2.5s; }
.art img.on { opacity: 1; }
.art-cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 60px 36px 24px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #f3efe6; }
.art-cap .t { font-family: var(--display); font-size: 24px; line-height: 1.2; }
.art-cap .by { font-size: 16px; opacity: .75; margin-top: 4px; }
.art-cap .clock { font-family: var(--display); font-size: 40px; white-space: nowrap; }

/* Tab rail */
.rail {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: stretch;
  padding: 18px 0;
  gap: 4px;
}
.rail-time { text-align: center; font-family: var(--display); font-size: 24px; height: 52px; line-height: 52px; color: var(--muted); }
.tab {
  position: relative;
  background: none; border: 0;
  height: 74px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--muted);
  font-size: 14px; font-weight: 600; letter-spacing: .5px;
}
.tab svg { width: 32px; height: 32px; }
.tab[aria-selected="true"] { color: var(--fg); background: var(--panel-2); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--lamp); }
.tab .badge { position: absolute; top: 14px; right: 22px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--lamp); color: var(--lamp-ink); font-size: 13px; line-height: 22px; text-align: center; padding: 0 5px; box-sizing: border-box; }
.rail .spacer { flex: 1; }
.rail-batt { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 15px; font-weight: 600; padding-bottom: 4px; }
.rail-batt svg { width: 40px; height: 24px; }
.rail-batt.low { color: var(--lamp); }

/* Shared controls */
.btn { border: 0; border-radius: 14px; height: 56px; padding: 0 24px; font-weight: 600; font-size: 19px; background: var(--panel-2); }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); }
.btn.quiet { background: none; color: var(--muted); }
.btn.icon { width: 56px; padding: 0; font-size: 26px; line-height: 1; }
.btn:disabled { opacity: .4; }
.field {
  box-sizing: border-box; width: 100%; height: 60px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--bg); padding: 0 18px; font-size: 21px;
  -webkit-user-select: text; user-select: text;
}
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; height: 48px; padding: 0 18px; font-size: 18px; font-weight: 500; }
.chip-btn[aria-pressed="true"] { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.chip-btn:disabled { opacity: .35; }
.chip-btn[aria-pressed="true"] span { color: var(--lamp-ink) !important; }

/* Home */
.home { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; }
.col { display: flex; flex-direction: column; gap: 26px; min-width: 0; min-height: 0; }
.clock { display: flex; align-items: baseline; gap: 12px; }
.time { font-family: var(--display); font-weight: 400; font-size: 156px; line-height: .86; letter-spacing: -6px; }
.ampm { font-family: var(--display); font-size: 32px; color: var(--muted); letter-spacing: 1px; }
.date { font-size: 28px; font-weight: 500; margin-top: 14px; }
.date span { color: var(--lamp); }
.now { display: flex; align-items: center; gap: 20px; padding-top: 22px; border-top: 1px solid var(--line); }
.now svg { width: 76px; height: 76px; flex: none; }
.temp { font-family: var(--display); font-size: 76px; line-height: 1; letter-spacing: -2px; }
.now-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.now-meta .cond { font-size: 23px; font-weight: 600; }
.now-meta .sub { color: var(--muted); font-size: 17px; }
.next { display: flex; flex-direction: column; gap: 6px; }
.next .ttl { font-family: var(--display); font-size: 36px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next .in { font-size: 19px; color: var(--lamp); font-weight: 600; }
.next .in span { color: var(--muted); font-weight: 400; }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: auto; }
.day { background: var(--panel); border-radius: 14px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.day .dn { font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.day svg { width: 38px; height: 38px; }
.day .hl { font-size: 19px; font-weight: 600; }
.day .hl i { font-style: normal; color: var(--muted); font-weight: 400; }
.day .pp { font-size: 14px; color: var(--rain); min-height: 17px; }
.agenda { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow: hidden; }
.group h2 { margin: 0 0 8px; display: flex; justify-content: space-between; }
.group h2 b { color: var(--lamp); font-weight: 600; }
.ev { display: grid; grid-template-columns: 112px 6px 1fr; gap: 0 14px; align-items: center; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.ev:last-child { border-bottom: 0; }
.ev .when { font-size: 18px; color: var(--muted); text-align: right; white-space: nowrap; }
.ev .dot { width: 6px; height: 28px; border-radius: 3px; }
.ev .what { font-size: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev.past { opacity: .45; }
.ev.live .when { color: var(--lamp); font-weight: 600; }
.empty { color: var(--muted); font-size: 20px; padding: 6px 0; }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }

/* Calendar week */
.cal-view { display: flex; flex-direction: column; }
.week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.wday { background: var(--panel); border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; overflow: hidden; }
.wday-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px; }
.wday-h .dn { font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.wday-h .dd { font-family: var(--display); font-size: 30px; }
.wday.today { background: var(--panel-2); }
.wday.today .dd { color: var(--lamp); }
.wev { border: 0; text-align: left; background: var(--bg); border-radius: 10px; padding: 8px 10px 8px 12px; border-left: 4px solid var(--muted); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wev .t { font-size: 14px; color: var(--muted); }
.wev .n { font-size: 17px; font-weight: 500; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wday .more { font-size: 14px; color: var(--muted); padding: 0 4px; }
.wday .add-here { margin-top: auto; border: 1px dashed var(--line); background: none; border-radius: 10px; height: 44px; color: var(--muted); font-size: 22px; }

/* Lists: groceries, chores */
.split { display: grid; grid-template-columns: 1fr 400px; gap: 36px; height: calc(100% - 78px); }
.list { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.row { border: 0; background: none; text-align: left; display: flex; align-items: center; gap: 18px; min-height: 64px; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 23px; font-weight: 500; }
.row .box { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.row.done { color: var(--muted); }
.row.done .label { text-decoration: line-through; }
.row.done .box { background: var(--lamp); border-color: var(--lamp); }
.row.done .box::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--lamp-ink); border-bottom: 3px solid var(--lamp-ink); transform: rotate(-45deg) translate(1px, -1px); }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who { font-size: 15px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.add-row { display: flex; gap: 10px; }
.add-row .field { flex: 1; min-width: 0; }
.count { font-size: 18px; color: var(--muted); }
.g-foot { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.g-sync { border: 0; background: none; padding: 8px 24px; font-size: 16px; color: var(--muted); text-align: left; }
.g-sync.err { color: #e58a7a; }
.sheet .hint { font-size: 17px; color: var(--muted); line-height: 1.4; }

/* Meals */
.meals { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: calc(100% - 78px); }
.meal { border: 0; text-align: left; background: var(--panel); border-radius: 16px; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.meal.today { background: var(--panel-2); }
.meal .dn { font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.meal.today .dn { color: var(--lamp); }
.meal .dish { font-family: var(--display); font-size: 26px; line-height: 1.15; overflow-wrap: break-word; }
.meal .dish.none { color: var(--muted); font-family: var(--body); font-size: 18px; }
.meal .edit { margin-top: auto; font-size: 15px; color: var(--muted); }

/* Sports */
.sports { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; height: 100%; }
.team { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; overflow: hidden; }
.team.clt { --team: #3da3e4; }
.team.chk { --team: #e8475e; }
.team-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 3px solid var(--team); padding-bottom: 10px; }
.team-h h2 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 600; letter-spacing: -.5px; }
.team-h .rec { font-family: var(--display); font-size: 30px; }
.team-sub { color: var(--muted); font-size: 17px; margin-top: -8px; }
.game { background: var(--panel); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.game .when { font-size: 16px; color: var(--muted); }
.game .vs { font-family: var(--display); font-size: 32px; line-height: 1.05; }
.game .vs small { font-family: var(--body); font-size: 18px; color: var(--muted); }
.wdl { display: flex; height: 30px; border-radius: 8px; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 30px; }
.wdl div { text-align: center; white-space: nowrap; overflow: hidden; color: #0d1115; }
.wdl .w { background: var(--team); } .wdl .d { background: #6b7784; } .wdl .l { background: #c4cdd6; }
.wdl-key { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-top: -4px; }
.pick { font-size: 18px; } .pick b { color: var(--team); }
.pick-why { font-size: 15px; color: var(--muted); }
.mini-rows { display: flex; flex-direction: column; }
.mini-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 17px; }
.mini-row:last-child { border-bottom: 0; }
.mini-row .d { color: var(--muted); font-size: 15px; }
.mini-row .o { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mini-row .r { color: var(--muted); font-size: 15px; white-space: nowrap; }
.table-rows .mini-row { grid-template-columns: 24px 1fr 52px; padding: 5px 0; font-size: 16px; }
.table-rows .mini-row .r { text-align: right; color: var(--fg); }
.table-rows .mini-row.us { color: var(--team); font-weight: 600; }
.asof { font-size: 13px; color: var(--muted); margin-top: auto; }

/* Music (Spotify, played on the Sonos speakers) */
.music { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: minmax(0, 1fr); gap: 40px; height: 100%; }
.np { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.np-art { width: 360px; height: 360px; border-radius: 18px; background: var(--panel) center/cover no-repeat; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.np-art svg { width: 80px; height: 80px; opacity: .5; }
.np-ttl { font-family: var(--display); font-size: 30px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-by { font-size: 19px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -8px; }
.np-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.np-bar div { height: 100%; background: var(--lamp); }
.np-ctl { display: flex; align-items: center; gap: 14px; }
.np-ctl .btn.icon svg { width: 26px; height: 26px; }
.np-ctl .play { width: 76px; height: 76px; border-radius: 50%; }
.np-ctl .play svg { width: 32px; height: 32px; }
.np-vol { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 17px; color: var(--muted); }
.np-vol .btn.icon { width: 48px; height: 48px; font-size: 24px; }
.np-vol b { min-width: 40px; text-align: center; color: var(--fg); font-weight: 600; }
.lib { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
.lib-h { display: flex; gap: 10px; align-items: center; }
.lib-h .add-row { flex: 1; }
.tiles { flex: 1 1 auto; touch-action: pan-y; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; align-content: start; }
.tile { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; }
.tile i { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--panel) center/cover no-repeat; }
.tile b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }
.tile.on b { color: var(--lamp); }
.tiles.songs { display: block; }
.det-h { display: flex; align-items: center; gap: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.det-h i { flex: none; width: 96px; height: 96px; border-radius: 12px; background: var(--panel) center/cover no-repeat; }
.det-h div { flex: 1; min-width: 0; }
.det-h b { display: block; font-family: var(--display); font-size: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.det-h span { font-size: 16px; color: var(--muted); }
.song { width: 100%; border: 0; background: none; text-align: left; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; min-height: 60px; padding: 4px 4px; border-bottom: 1px solid var(--line); }
.song .n { color: var(--muted); font-size: 16px; text-align: right; }
.song b { display: block; font-size: 19px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song span { display: block; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song .d { color: var(--muted); font-size: 15px; }
.song.on b, .song.on .n { color: var(--lamp); }
.music-msg { font-size: 17px; color: var(--muted); line-height: 1.4; }
.music-msg.err { color: #e58a7a; }

/* Sheet (modal for adding things) */
.sheet-veil { position: fixed; inset: 0; background: #05080b; opacity: .7; }
.sheet {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 680px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.sheet h3 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 600; }
.sheet .actions { display: flex; justify-content: flex-end; gap: 10px; }
.sheet .actions .danger { margin-right: auto; color: #e58a7a; background: none; }
/* Event details */
.sheet.wide { width: 860px; }
.ev-detail { display: flex; gap: 28px; }
.ev-detail .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.ev-detail h3 { font-size: 38px; line-height: 1.12; overflow-wrap: break-word; }
.ev-detail .when { font-size: 24px; font-weight: 500; }
.ev-detail .meta { display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--muted); }
.ev-detail .meta i { flex: none; width: 14px; height: 14px; border-radius: 50%; }
.ev-detail .notes { font-size: 19px; line-height: 1.45; color: var(--fg); white-space: pre-line; overflow-wrap: break-word; max-height: 240px; overflow-y: auto; background: var(--bg); border-radius: 14px; padding: 14px 18px; }
.ev-detail .qr { flex: none; width: 200px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; font-size: 16px; color: var(--muted); }
.ev-detail .qr canvas, .ev-detail .qr img { width: 200px; height: 200px; border-radius: 12px; background: #ffffff; }

/* Overnight dimming. Real screen-off needs the kiosk app; this keeps the panel from lighting the room. */
.night-veil { position: fixed; inset: 0; background: #000000; opacity: 0; pointer-events: none; transition: opacity 2s; }
body.night .night-veil { opacity: .72; }

@media (max-height: 760px) and (min-width: 761px) { body { overflow: auto; } .app { height: 800px; } }
@media (max-width: 760px) {
  body { overflow: auto; font-size: 16px; }
  .sports { grid-template-columns: 1fr; height: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto; max-height: none; height: auto; padding-bottom: 84px; }
  .view { height: auto; padding: 24px 16px; }
  .rail { position: fixed; left: 0; right: 0; bottom: 0; flex-direction: row; padding: 0 0 env(safe-area-inset-bottom, 0px); border-left: 0; border-top: 1px solid var(--line); z-index: 5; }
  .rail-time, .rail .spacer, .rail-batt { display: none; }
  .tab { flex: 1; height: 72px; font-size: 12px; gap: 4px; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"]::before { left: 18px; right: 18px; top: 0; bottom: auto; width: auto; height: 3px; border-radius: 0 0 3px 3px; }
  .tab .badge { top: 6px; right: 14%; }

<script>
// Scale the 1280x800 panel to the screen, so it fills a 1920x1200 tablet the same as an 800px frame.
// Only ever shrinks: the tablet is already 1280x800, and a size read mid-boot once zoomed it in and cut off the edges.
// Measures the visible area (Android's web view can report a wider layout viewport than the screen) and pins
// the page to it, so the panel is centred on what's actually shown.
function fitPanel() {
  var app = document.querySelector('.app'), d = document.documentElement, vv = window.visualViewport;
  var w = Math.min(vv ? vv.width * vv.scale : innerWidth, innerWidth, d.clientWidth || Infinity, screen.width || Infinity);
  var h = Math.min(vv ? vv.height * vv.scale : innerHeight, innerHeight, d.clientHeight || Infinity, screen.height || Infinity);
  document.body.style.width = w + 'px'; document.body.style.height = h + 'px';
  app.style.zoom = Math.min(1, w / 1280, h / 800);
}
fitPanel();
['resize', 'orientationchange', 'load'].forEach(function (ev) { window.addEventListener(ev, fitPanel); });
document.addEventListener('visibilitychange', fitPanel);
setTimeout(fitPanel, 2000);

// ---- Settings: edit these, then reload the frame ----
var CONFIG = {
  place: 'Charlotte',
  lat: 35.2271,            // Charlotte, NC
  lon: -80.8431,
  timeZone: 'America/New_York', // clock and calendar show this zone's time, whatever the frame is set to
  units: 'fahrenheit',     // or 'celsius'
  clock24: false,
  calendarUrl: '',         // the calendar Worker's URL (see README). Usually passed once as #calendar=URL instead, since it holds a secret.
  sportsUrl: 'sports.json', // written by the Charlotte FC and Checkers update routines; see README
  groceriesProject: 'Groceries', // Todoist project the Groceries tab shows, once a token is saved on the frame (see README)
  people: ['Erik', 'Alex', 'All'],
  nightStart: 22,          // dim from 10pm
  nightEnd: 6.5,           // until 6:30am
  idleReturnSec: 120,      // go back to Home after this long without a touch
  cocktailsUrl: 'https://cocktailjournal.online/', // shown in the Cocktails tab
  cocktailsIdleMin: 15,    // taps inside the cocktail app aren't seen by the dashboard, so it waits longer before going Home
  artAfterMin: 0,          // in-page art slideshow after this many idle minutes; 0 = off (the tablet uses Fully's screensaver with art.html instead)
  artEverySec: 75,         // how long each painting stays up
  weatherEveryMin: 15,
  calendarEveryMin: 10
};

var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var CAL_COLORS = { family: '#f0b35e', school: '#72b4da', work: '#a9c98a', other: '#c9a0dc' };
var QUICK = ['Milk','Eggs','Bread','Bananas','Apples','Coffee','Butter','Cheese','Yogurt','Chicken','Pasta','Rice','Onions','Paper towels'];
var MEAL_IDEAS = ['Tacos','Pasta','Stir fry','Pizza night','Soup','Burgers','Salmon','Leftovers','Eat out'];

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function at(d, h, m) { var x = new Date(d); x.setHours(h, m || 0, 0, 0); return x; }
function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
// Wall-clock time in CONFIG.timeZone, as a Date whose local fields read as that zone's time
var zoneFmt = null;
try { zoneFmt = new Intl.DateTimeFormat('en-US', { timeZone: CONFIG.timeZone, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }); } catch (e) {}
function zt(x) {
  var d = new Date(x);
  if (!zoneFmt) return d;
  var p = {};
  zoneFmt.formatToParts(d).forEach(function (part) { p[part.type] = +part.value; });
  return new Date(p.year, p.month - 1, p.day, p.hour % 24, p.minute, p.second);
}
function nowZ() { return zt(Date.now()); }
// Events added on the frame are stored as zone-free wall time, e.g. "2026-10-15T18:00"
function wallStr(d) { function z(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function parseWall(s) { var m = String(s).split(/[-T:]/); return new Date(+m[0], +m[1] - 1, +m[2], +(m[3] || 0), +(m[4] || 0)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function hm(d) {
  var h = d.getHours(), m = d.getMinutes();
  if (CONFIG.clock24) return h + ':' + (m < 10 ? '0' : '') + m;
  var h12 = h % 12 || 12;
  return h12 + (m ? ':' + (m < 10 ? '0' : '') + m : '') + (h < 12 ? 'a' : 'p');
}

// ---- Storage. Lives on this device for now; swap get/set for a sync server so phones can add too. ----
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('frame.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('frame.' + k, JSON.stringify(v)); } catch (e) {} }
};

var state = {
  tab: 'home', weekOffset: 0,
  weatherLive: false, calLive: false, feedEvents: null, calMeals: {},
  localEvents: store.get('events', []),
  groceries: store.get('groceries', [
    { id: 'g1', name: 'Milk', done: false }, { id: 'g2', name: 'Eggs', done: false },
    { id: 'g3', name: 'Bananas', done: true }, { id: 'g4', name: 'Coffee', done: false },
    { id: 'g5', name: 'Taco shells', done: false }
  ]),
  meals: store.get('meals', {}),
  chores: store.get('chores', [
    { id: 'c1', name: 'Empty the dishwasher', who: 'Alex' }, { id: 'c2', name: 'Take out trash', who: 'Erik' },
    { id: 'c3', name: 'Make beds', who: 'Alex' }, { id: 'c4', name: 'Water plants', who: 'All' },
    { id: 'c5', name: 'Tidy living room', who: 'All' }
  ]),
  choreDone: store.get('choreDone', { day: '', ids: [] }),
  choreWho: 'All'
};
if (!store.get('meals', null)) {
  var t0 = nowZ();
  state.meals[dayKey(t0)] = 'Tacos';
  state.meals[dayKey(addDays(t0, 1))] = 'Salmon and rice';
  state.meals[dayKey(addDays(t0, 3))] = 'Pizza night';
}

// Redraw a panel only when its content changed. Background refreshes land a few seconds after load;
// swapping identical buttons under a finger mid-tap made that tap do nothing.
function fill(id, html) { var n = el(id); if (n._html !== html) { n._html = html; n.innerHTML = html; } }

// ---- Tabs and idle return ----
function showTab(tab) {
  state.tab = tab;
  ['home', 'calendar', 'groceries', 'meals', 'chores', 'cocktails', 'music', 'sports'].forEach(function (t) { el('view-' + t).hidden = t !== tab; });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false'); });
  el('rail-time').style.visibility = tab === 'home' ? 'hidden' : 'visible';
  if (tab !== 'calendar') state.weekOffset = 0;
  renderAll();
  if (tab === 'groceries') pullGroceries();
  if (tab === 'music') { pullMusic(); if (!music.listLoaded) loadPlaylists(); }
  // Load the cocktail app the first time its tab opens, then keep it so searches survive switching tabs
  if (tab === 'cocktails' && !el('view-cocktails').firstChild) el('view-cocktails').innerHTML = '<iframe src="' + esc(CONFIG.cocktailsUrl) + '" title="Cocktail Journal" allow="clipboard-write"></iframe>';
}
var lastTouch = Date.now();
['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { lastTouch = Date.now(); }, true); });

// ---- Clock and night mode ----
function tick() {
  var d = nowZ(), h = d.getHours(), m = d.getMinutes();
  var mm = (m < 10 ? '0' : '') + m;
  var t = CONFIG.clock24 ? h + ':' + mm : (h % 12 || 12) + ':' + mm;
  el('time').textContent = t;
  el('rail-time').textContent = t;
  el('ampm').textContent = CONFIG.clock24 ? '' : (h < 12 ? 'AM' : 'PM');
  el('date').innerHTML = DAYS[d.getDay()] + ', <span>' + MONTHS[d.getMonth()] + ' ' + d.getDate() + '</span>';
  var hour = h + m / 60;
  var night = CONFIG.nightStart > CONFIG.nightEnd
    ? (hour >= CONFIG.nightStart || hour < CONFIG.nightEnd)
    : (hour >= CONFIG.nightStart && hour < CONFIG.nightEnd);
  document.body.classList.toggle('night', night && Date.now() - lastTouch > 60000);
  var idleMs = state.tab === 'cocktails' ? CONFIG.cocktailsIdleMin * 60000 : CONFIG.idleReturnSec * 1000;
  if (state.tab !== 'home' && el('sheet-root').hidden && Date.now() - lastTouch > idleMs) showTab('home');
  if (state.choreDone.day !== dayKey(d)) { state.choreDone = { day: dayKey(d), ids: [] }; store.set('choreDone', state.choreDone); renderBadges(); }
}

// ---- Weather (Open-Meteo: free, no key, allows browser requests) ----
var ICON = {
  sun: '<circle cx="24" cy="24" r="8" fill="none" stroke="#f0b35e" stroke-width="3"/><g stroke="#f0b35e" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g>',
  partly: '<circle cx="18" cy="18" r="6.5" fill="none" stroke="#f0b35e" stroke-width="3"/><g stroke="#f0b35e" stroke-width="3" stroke-linecap="round"><path d="M18 5v3M5 18h3M8.8 8.8l2.1 2.1M27.2 8.8l-2.1 2.1"/></g><path d="M16 38h20a7 7 0 0 0 0-14 10 10 0 0 0-19 3 5.5 5.5 0 0 0-1 11z" fill="#192028" stroke="#ede8e0" stroke-width="3" stroke-linejoin="round"/>',
  cloud: '<path d="M13 36h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="none" stroke="#ede8e0" stroke-width="3" stroke-linejoin="round"/>',
  fog: '<g stroke="#8f9aa6" stroke-width="3" stroke-linecap="round"><path d="M8 18h32M12 25h28M8 32h28M14 39h20"/></g>',
  rain: '<path d="M13 28h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="none" stroke="#ede8e0" stroke-width="3" stroke-linejoin="round"/><g stroke="#72b4da" stroke-width="3" stroke-linecap="round"><path d="M17 34l-2 6M25 34l-2 6M33 34l-2 6"/></g>',
  snow: '<path d="M13 28h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="none" stroke="#ede8e0" stroke-width="3" stroke-linejoin="round"/><g fill="#72b4da"><circle cx="16" cy="37" r="2.2"/><circle cx="24" cy="41" r="2.2"/><circle cx="32" cy="37" r="2.2"/></g>',
  storm: '<path d="M13 28h23a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-2 13z" fill="none" stroke="#ede8e0" stroke-width="3" stroke-linejoin="round"/><path d="M26 30l-5 8h6l-4 7" fill="none" stroke="#f0b35e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
};
// WMO weather codes, as Open-Meteo reports them
function wmo(code) {
  if (code === 0) return ['sun', 'Clear'];
  if (code <= 2) return ['partly', code === 1 ? 'Mostly clear' : 'Partly cloudy'];
  if (code === 3) return ['cloud', 'Cloudy'];
  if (code === 45 || code === 48) return ['fog', 'Fog'];
  if (code >= 51 && code <= 57) return ['rain', 'Drizzle'];
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ['rain', code >= 80 ? 'Showers' : 'Rain'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['snow', 'Snow'];
  if (code >= 95) return ['storm', 'Thunderstorms'];
  return ['cloud', 'Cloudy'];
}
function svg(name) { return '<svg viewBox="0 0 48 48" aria-hidden="true">' + ICON[name] + '</svg>'; }

function sampleWeather() {
  var today = nowZ(), daily = { time: [], weather_code: [61, 2, 0, 3, 80], temperature_2m_max: [61, 64, 68, 63, 57], temperature_2m_min: [48, 47, 51, 50, 45], precipitation_probability_max: [70, 10, 0, 20, 60] };
  for (var i = 0; i < 5; i++) { var d = addDays(today, i); daily.time.push(d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()); }
  return { current: { temperature_2m: 54, apparent_temperature: 51, weather_code: 3, wind_speed_10m: 9 }, daily: daily };
}

function renderWeather(w) {
  var c = w.current, k = wmo(c.weather_code), dly = w.daily;
  var unit = CONFIG.units === 'celsius' ? 'C' : 'F';
  el('now').innerHTML = svg(k[0]) +
    '<div class="temp">' + Math.round(c.temperature_2m) + '°</div>' +
    '<div class="now-meta"><div class="cond">' + k[1] + '</div>' +
    '<div class="sub">Feels ' + Math.round(c.apparent_temperature) + '°' + unit + ' · Wind ' + Math.round(c.wind_speed_10m) + (unit === 'F' ? ' mph' : ' km/h') +
    ' · H ' + Math.round(dly.temperature_2m_max[0]) + '° L ' + Math.round(dly.temperature_2m_min[0]) + '°</div></div>';
  var html = '';
  for (var i = 0; i < 5; i++) {
    var parts = String(dly.time[i]).split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var pp = dly.precipitation_probability_max[i];
    html += '<div class="day"><div class="dn">' + (i === 0 ? 'Today' : DAYS[d.getDay()].slice(0, 3)) + '</div>' +
      svg(wmo(dly.weather_code[i])[0]) +
      '<div class="hl">' + Math.round(dly.temperature_2m_max[i]) + '° <i>' + Math.round(dly.temperature_2m_min[i]) + '°</i></div>' +
      '<div class="pp">' + (pp >= 20 ? pp + '%' : '') + '</div></div>';
  }
  fill('days', html);
}

function loadWeather() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&temperature_unit=' + CONFIG.units + '&wind_speed_unit=' + (CONFIG.units === 'celsius' ? 'kmh' : 'mph') +
    '&timezone=auto&forecast_days=5';

var TD = 'https://api.todoist.com/api/v1/';

// and nothing secret is in this public page. They're saved on the frame, then removed from the address.
(function () {

  location.hash.slice(1).split('&').forEach(function (kv) {
    var i = kv.indexOf('='), k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
    if (k === 'todoist' && /^[0-9a-f]{20,}$/i.test(v)) setTodoToken(v);

    var hit = (j.results || []).filter(function (p) { return !p.is_archived && String(p.name).toLowerCase() === name; })[0];
    if (hit) return hit.id;

function fullyBattery() {
  if (!window.fully || !fully.getBatteryLevel) return;
  var draw = function () { renderBattery(fully.getBatteryLevel() / 100, !!(fully.isPlugged && fully.isPlugged())); };
  draw(); setInterval(draw, 60000);
}
startBattery();

// ---- Art slideshow. Public-domain paintings from the Art Institute of Chicago, shown after CONFIG.artAfterMin idle; a tap closes it. ----
var art = { list: [], on: false, front: 'art-a', timer: null, loading: false };
function loadArt() {
  if (art.loading) return; art.loading = true;
  var params = { query: { bool: { must: [{ term: { is_public_domain: true } }, { term: { 'artwork_type_title.keyword': 'Painting' } }] } },
    fields: 'id,title,artist_title,date_display,image_id,thumbnail', limit: 100, page: 1 + Math.floor(Math.random() * 10) };
  var url = 'https://api.artic.edu/api/v1/artworks/search?params=' + encodeURIComponent(JSON.stringify(params));
  fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
    // Landscape pictures only, so they fill the screen
    art.list = (j.data || []).filter(function (a) { var t = a.thumbnail; return a.image_id && t && t.width > t.height * 1.15; })
      .sort(function () { return Math.random() - .5; });
  }).catch(function () {}).then(function () { art.loading = false; });
}
function artImg(a) { return 'https://www.artic.edu/iiif/2/' + a.image_id + '/full/1686,/0/default.jpg'; }
function nextArt() {
  if (!art.list.length) { loadArt(); return; }
  var a = art.list.shift(), back = art.front === 'art-a' ? 'art-b' : 'art-a', img = el(back);
  img.onload = function () {
    if (!art.on) return;
    img.className = 'on'; el(art.front).className = ''; art.front = back;
    el('art-title').textContent = a.title || '';
    el('art-by').textContent = [a.artist_title, a.date_display].filter(Boolean).join(', ');
  };
  img.onerror = function () { if (art.on) nextArt(); };
  img.src = artImg(a);
  if (art.list.length < 3) loadArt();
}
function startArt() {
  art.on = true; el('art').hidden = false; artClock(); nextArt();
  art.timer = setInterval(nextArt, CONFIG.artEverySec * 1000);
}
function stopArt() {
  art.on = false; el('art').hidden = true; clearInterval(art.timer);
  el('art-a').className = el('art-b').className = '';
}
function artClock() { el('art-clock').textContent = el('time').textContent + ' ' + el('ampm').textContent; }
el('art').addEventListener('click', function (ev) { ev.stopPropagation(); stopArt(); });
// With Fully Kiosk PLUS face/motion detection, someone looking at the screen counts as a touch: close the art and stay on the dashboard
function seen() { lastTouch = Date.now(); if (art.on) stopArt(); }
if (window.fully && fully.bind) { try { fully.bind('onMotion', 'seen();'); } catch (e) {} }
if (CONFIG.artAfterMin) {
  loadArt();
  setInterval(function () {
    if (art.on) { artClock(); return; }
    if (art.list.length && el('sheet-root').hidden && Date.now() - lastTouch > CONFIG.artAfterMin * 60000) startArt();
  }, 15000);
}

// ---- Sports. Loaded from CONFIG.sportsUrl; this copy is the fallback until the file is reachable. Games drop off once played. ----
var SPORTS = {
  clt: {
    asof: 'MLS standings through Oct 10',
    rec: '13-8-7', pts: 46, place: '5th in the East',
    last: 'Beat Dallas 3-2 from 2-0 down, Oct 10',

    form: 0.5, homeAdv: 1.12, leagueGoals: 3.21,
    season: { gf: 50, ga: 40, gp: 28 }, post: { gf: 26, ga: 17, gp: 13 },
    games: [
      { at: '2026-10-14T19:30', opp: 'Columbus', home: false, gf: 41, ga: 46, gp: 28 },
      { at: '2026-10-17T14:30', opp: 'Philadelphia', home: false, gf: 56, ga: 45, gp: 28 },

    ],

  },

    games: [
      { at: '2026-10-16', opp: 'Hartford', home: true, pick: 'Checkers win 4-2', why: 'Hartford has lost two straight and allowed 16 goals in 5 games. Home opener.' },
      { at: '2026-10-17', opp: 'Hartford', home: true, pick: 'Hartford wins 3-2 in OT', why: 'Second game of a back-to-back, likely with the backup goalie.' },
      { at: '2026-10-23', opp: 'Springfield', home: true, pick: 'Checkers win 3-2', why: 'Springfield scores about 2 a game, and Charlotte just beat them.' },
      { at: '2026-10-24', opp: 'Springfield', home: true, pick: null },

    ],

};

// Charlotte FC odds: the same Poisson model as the Stretch Run board, with its default settings
function poisson(l) { var p = [Math.exp(-l)]; for (var k = 1; k <= 14; k++) p.push(p[k - 1] * l / k); return p; }
function cltOdds(g) {
  var c = SPORTS.clt, L = c.leagueGoals / 2, f = c.form;
  var att = (1 - f) * (c.season.gf / c.season.gp / L) + f * (c.post.gf / c.post.gp / L);
  var def = (1 - f) * (c.season.ga / c.season.gp / L) + f * (c.post.ga / c.post.gp / L);
  var h = g.home ? c.homeAdv : 1 / c.homeAdv;
  var us = L * att * (g.ga / g.gp / L) * h, them = L * (g.gf / g.gp / L) * def / h;
  var pa = poisson(us), pb = poisson(them), w = 0, d = 0, l = 0;
  for (var i = 0; i < pa.length; i++) for (var j = 0; j < pb.length; j++) { var p = pa[i] * pb[j]; if (i > j) w += p; else if (i === j) d += p; else l += p; }
  var t = w + d + l;
  return { w: w / t, d: d / t, l: l / t };
}
function pc(x) { return Math.round(x * 100) + '%'; }
function gameDay(s) { var d = parseWall(s); return DAYS[d.getDay()].slice(0, 3) + ', ' + MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function upcomingGames(list) {
  var cut = nowZ(); cut.setHours(cut.getHours() - 3); // keep a game up while it's being played
  return list.filter(function (g) { var d = parseWall(g.at); if (g.at.length === 10) d.setHours(23, 59); return d > cut; });
}
function tableRows(rows, us) {
  return '<div class="mini-rows table-rows">' + rows.map(function (r, i) {
    return '<div class="mini-row' + (r[0] === us ? ' us' : '') + '"><span class="d">' + (i + 1) + '</span><span class="o">' + esc(r[0]) + '</span><span class="r">' + r[1] + '</span></div>';
  }).join('') + '</div>';
}

function renderSports() {
  var c = SPORTS.clt, cg = upcomingGames(c.games), html;
  html = '<div class="team-h"><h2>Charlotte FC</h2><span class="rec">' + c.rec + '</span></div>' +
    '<div class="team-sub">' + c.pts + ' pts · ' + c.place + ' · ' + esc(c.last) + '</div>';
  if (cg.length) {
    var g = cg[0], o = cltOdds(g), d = parseWall(g.at);
    html += '<div class="game"><div class="when">Next · ' + gameDay(g.at) + ' · ' + hm(d) + '</div>' +
      '<div class="vs">' + (g.home ? 'vs ' : 'at ') + esc(g.opp) + ' <small>' + (g.home ? 'Bank of America Stadium' : 'away') + '</small></div>' +
      '<div class="wdl"><div class="w" style="flex-basis:' + o.w * 100 + '%">' + pc(o.w) + '</div><div class="d" style="flex-basis:' + o.d * 100 + '%">' + pc(o.d) + '</div><div class="l" style="flex-basis:' + o.l * 100 + '%">' + pc(o.l) + '</div></div>' +
      '<div class="wdl-key"><span>Win</span><span>Draw</span><span>Loss</span></div></div>';
    html += '<div class="mini-rows">' + cg.slice(1, 4).map(function (g) {
      var o = cltOdds(g);
      return '<div class="mini-row"><span class="d">' + gameDay(g.at).slice(5) + '</span><span class="o">' + (g.home ? 'vs ' : 'at ') + esc(g.opp) + '</span><span class="r">Win ' + pc(o.w) + '</span></div>';
    }).join('') + '</div>';
  } else html += '<div class="game"><div class="vs">Regular season over</div></div>';
  html += '<div class="eyebrow">East top 5 · points</div>' + tableRows(c.table, 'Charlotte') +
    '<div class="asof">' + esc(c.leaders) + '<br>' + esc(c.asof) + '</div>';
  fill('clt', html);

  var k = SPORTS.chk, kg = upcomingGames(k.games);
  html = '<div class="team-h"><h2>Checkers</h2><span class="rec">' + k.rec + '</span></div>' +
    '<div class="team-sub">' + k.pts + ' pts · ' + k.place + ' · ' + esc(k.last) + '</div>';
  if (kg.length) {
    var n = kg[0];
    html += '<div class="game"><div class="when">Next · ' + gameDay(n.at) + '</div>' +
      '<div class="vs">' + (n.home ? 'vs ' : 'at ') + esc(n.opp) + ' <small>' + (n.home ? 'Bojangles Coliseum' : 'away') + '</small></div>' +
      (n.pick ? '<div class="pick">Pick: <b>' + esc(n.pick) + '</b></div><div class="pick-why">' + esc(n.why) + '</div>' : '<div class="pick-why">No pick yet</div>') + '</div>';
    html += '<div class="mini-rows">' + kg.slice(1, 4).map(function (g) {
      return '<div class="mini-row"><span class="d">' + gameDay(g.at).slice(5) + '</span><span class="o">' + (g.home ? 'vs ' : 'at ') + esc(g.opp) + '</span><span class="r">' + (g.pick ? esc(g.pick) : 'No pick yet') + '</span></div>';
    }).join('') + '</div>';
  }
  html += '<div class="eyebrow">Atlantic · points %</div>' + tableRows(k.table, 'Charlotte') +
    '<div class="asof">' + esc(k.leaders) + '<br>' + esc(k.asof) + '</div>';
  fill('chk', html);
}

function loadSports() {
  if (!CONFIG.sportsUrl) return Promise.resolve();
  return fetch(CONFIG.sportsUrl, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      if (j && j.clt) SPORTS.clt = j.clt;
      if (j && j.chk) SPORTS.chk = j.chk;
      if (state.tab === 'sports' && el('sheet-root').hidden) renderSports();
    })
    .catch(function () {});
}

setInterval(function () { if (el('sheet-root').hidden && state.tab !== 'groceries' && state.tab !== 'chores') renderAll(); }, 60000);
// Reload once a night to clear any memory creep on the 1 GB frame
setInterval(function () { var d = nowZ(); if (d.getHours() === 3 && d.getMinutes() < 1 && state.tab === 'home') location.reload(); }, 60000);
